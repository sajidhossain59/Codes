<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,
initial-scale=1, maximum-scale=1, user-scalable=no">

<title>ROBO SOCCER CONTROLLER</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #101820;
    color: white;
    font-family: Arial;
    text-align: center;
    user-select: none;
    touch-action: none;
}

h2 {
    margin-top: 35px;
    font-size: 23px;
    color: #00e5ff;
}

#joystick {
    width: min(78vw, 340px);
    height: min(78vw, 340px);
    margin: 55px auto 35px;
    background: #263746;
    border: 4px solid #00e5ff;
    border-radius: 50%;
    position: relative;
    touch-action: none;
}

#stick {
    width: 85px;
    height: 85px;
    background: linear-gradient(145deg,#00e5ff,#007bff);
    border-radius: 50%;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
}

#returnBtn {
    background: #00bcd4;
    color: #101820;
    border: none;
    padding: 16px 35px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
}

#returnBtn:disabled {
    opacity: 0.5;
}
</style>
</head>

<body>

<h2>ROBO SOCCER CONTROLLER</h2>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="returnBtn">GO & RETURN</button>

<script>
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const returnBtn = document.getElementById("returnBtn");

let active = false;
let x = 0, y = 0;
let lastSend = 0;

function sendCommand(force = false) {
    const now = Date.now();

    if (!force && now - lastSend < 40) return;

    lastSend = now;

    fetch(`/control?x=${x.toFixed(3)}&y=${y.toFixed(3)}`)
        .catch(() => {});
}

function moveJoystick(e) {
    if (!active) return;

    const rect = joystick.getBoundingClientRect();

    let dx = e.clientX - rect.left - rect.width / 2;
    let dy = rect.top + rect.height / 2 - e.clientY;

    const max = rect.width / 2 - 48;
    const distance = Math.hypot(dx, dy);

    if (distance > max) {
        dx *= max / distance;
        dy *= max / distance;
    }

    x = dx / max;
    y = dy / max;

    stick.style.left = (50 + dx / rect.width * 100) + "%";
    stick.style.top = (50 - dy / rect.height * 100) + "%";

    sendCommand();
}

function resetJoystick() {
    if (!active) return;

    active = false;
    x = 0;
    y = 0;

    stick.style.left = "50%";
    stick.style.top = "50%";

    sendCommand(true);
}

joystick.addEventListener("pointerdown", e => {
    active = true;
    joystick.setPointerCapture(e.pointerId);
    moveJoystick(e);
});

joystick.addEventListener("pointermove", moveJoystick);
joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);

returnBtn.addEventListener("click", async () => {
    if (active) resetJoystick();

    returnBtn.disabled = true;

    try {
        await fetch("/sequence");
    } catch(e) {}

    setTimeout(() => {
        returnBtn.disabled = false;
    }, 1500);
});
</script>

</body>
</html>
