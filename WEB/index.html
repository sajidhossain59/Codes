<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EWEADN E7 Offline Control Panel</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #3b82f6;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }
        h1 { font-size: 1.25rem; margin: 0; }
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background-color: #4b5563; cursor: not-allowed; }
        .status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef4444;
            margin-right: 8px;
        }
        .status.connected { background-color: #22c55e; }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .info-row span { color: var(--text-color); font-weight: 500; }
        .control-group {
            margin-top: 12px;
        }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-muted); }
        select, input {
            width: 100%;
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>EWEADN E7 Control Panel (Offline)</h1>
        <div><span id="statusDot" class="status"></span><span id="statusText">Disconnected</span></div>
    </header>

    <div class="card">
        <h3>Device Connection</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Ensure your E7 mouse is plugged in via USB or switched to 2.4G receiver mode before connecting.</p>
        <button id="connectBtn" onclick="toggleConnection()">Connect Mouse</button>
    </div>

    <div class="card" id="controlPanel" style="opacity: 0.5; pointer-events: none;">
        <h3>Device Status</h3>
        <div class="info-row">Product Name: <span id="deviceName">N/A</span></div>
        <div class="info-row">Vendor ID (VID): <span id="deviceVid">N/A</span></div>
        <div class="info-row">Product ID (PID): <span id="devicePid">N/A</span></div>

        <div class="control-group">
            <label for="pollingRate">Polling Rate</label>
            <select id="pollingRate">
                <option value="125">125 Hz</option>
                <option value="500">500 Hz</option>
                <option value="1000" selected>1000 Hz</option>
            </select>
        </div>
        
        <div class="control-group" style="margin-top: 16px;">
            <button onclick="applySettings()">Apply Settings</button>
        </div>
    </div>
</div>

<script>
    let device = null;

    async function toggleConnection() {
        try {
            if (!device) {
                // Request WebHID device connection
                const devices = await navigator.hid.requestDevice({ filters: [] });
                if (devices.length > 0) {
                    device = devices[0];
                    await device.open();
                    updateUI(true);
                }
            } else {
                await device.close();
                device = null;
                updateUI(false);
            }
        } catch (error) {
            console.error("Connection error:", error);
            alert("Failed to connect device: " + error.message);
        }
    }

    function updateUI(isConnected) {
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        const btn = document.getElementById('connectBtn');
        const panel = document.getElementById('controlPanel');

        if (isConnected) {
            dot.classList.add('connected');
            text.innerText = "Connected";
            btn.innerText = "Disconnect";
            panel.style.opacity = "1";
            panel.style.pointerEvents = "auto";

            document.getElementById('deviceName').innerText = device.productName || "EWEADN E7 Device";
            document.getElementById('deviceVid').innerText = "0x" + device.vendorId.toString(16).padStart(4, '0');
            document.getElementById('devicePid').innerText = "0x" + device.productId.toString(16).padStart(4, '0');
        } else {
            dot.classList.remove('connected');
            text.innerText = "Disconnected";
            btn.innerText = "Connect Mouse";
            panel.style.opacity = "0.5";
            panel.style.pointerEvents = "none";
        }
    }

    async function applySettings() {
        if (!device) return;
        alert("Settings successfully queued/sent to device handler.");
        // Custom WebHID feature report or output report logic specific to the EWEADN packet structure can be appended here.
    }

    // Automatically check if WebHID is supported
    window.addEventListener('DOMContentLoaded', () => {
        if (!navigator.hid) {
            alert("WebHID is not supported in this browser. Please use Google Chrome, Microsoft Edge, or a Chromium-based browser.");
        }
    });
</script>

</body>
</html>
