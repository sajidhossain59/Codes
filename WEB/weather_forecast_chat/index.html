<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather AI Assistant</title>
  
  <!-- n8n Chat Widget CSS -->
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
  
  <style>
    /* Basic Page Styling */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f9;
      color: #333;
    }

    .container {
      text-align: center;
      padding: 2rem;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 400px;
    }

    /* n8n Chat Color Customization */
    :root {
      --chat--color--primary: #2563eb;
      --chat--color--primary-shade-50: #1d4ed8;
      --chat--color--primary--shade-100: #1e40af;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Weather Assistant</h1>
    <p>Click the chat bubble in the bottom-right corner to ask about current weather anywhere in the world!</p>
  </div>

  <!-- n8n Chat Widget Script -->
  <script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    createChat({
      // For local testing on the same machine, use your localhost URL or tunnel URL:
      // Example: 'https://xxxx.ngrok-free.app/webhook/d4c93f2a-dc32-44c4-98cf-0ff1d9b6eb9c/chat'
      webhookUrl: 'http://localhost:5678/webhook/d4c93f2a-dc32-44c4-98cf-0ff1d9b6eb9c/chat',
      
      initialMessages: [
        'Hello! 👋',
        'Where would you like to check the weather today?'
      ],
      i18n: {
        en: {
          title: 'Weather Bot',
          subtitle: 'Powered by Gemini & OpenWeather',
          inputPlaceholder: 'Type a city name...'
        }
      }
    });
  </script>

</body>
</html>
